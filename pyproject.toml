[build-system]
# torch must match the runtime range below: build isolation resolves this list on its
# own, and a mismatch links the C++ extensions against the wrong libtorch.
# setuptools floor: 77 is the first release that understands the PEP 639 `license`
# SPDX string and `license-files` below.
requires = ["setuptools>=77", "torch>=2.6,<2.12", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freetoken"
# Single source of truth: python/freetoken/version.py (read via the attr directive below).
dynamic = ["version"]
description = "Local MoE-offload LLM inference runtime with OpenAI- and Anthropic-compatible APIs"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "FlashML Team" }]
# No License:: classifier: setuptools>=77 rejects mixing one with the SPDX string above.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Environment :: GPU :: NVIDIA CUDA",
    "Environment :: GPU :: AMD ROCm",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Version ranges are floor=last-verified, ceiling=next-major (kept loose enough to
# resolve, tight enough to bar a silent breaking bump). These ranges are the contract;
# there is no lockfile.
dependencies = [
    "apache-tvm-ffi==0.1.13.post3", # pin it
    "einops>=0.8,<1",
    "fastapi>=0.115,<1",
    # slot_cache (device-side LRU admission for the MoE expert cache): sm70 fork installs
    # flashlib --no-deps separately. Its metadata floor triton>=3.6 drags the cu13 stack
    # (torch 2.11) that driver r550 cannot run; the pure-Triton slot_cache needs no 3.6 API.
    # "flashlib==0.3.0",
    "gguf>=0.19,<1",
    "huggingface_hub>=1.5,<2",
    "msgpack>=1.1,<2",
    "modelscope>=1.37,<2",
    # ceiling: numba (via flashlib) needs numpy<2.5
    "numpy>=2.0,<2.5",
    "openai>=2.0,<3",
    "partial-json-parser>=0.2,<1",
    "pillow>=10,<13",
    "prompt_toolkit>=3.0,<4",
    "pydantic>=2.9,<3",
    "pyzmq>=27,<28",
    "safetensors>=0.6,<1",
    # sm70 fork: floor lowered to 2.6 — the cu12x wheels (driver 550 = CUDA 12.4 ceiling)
    # ship sm_70 SASS; PyPI's plain torch 2.11 wheel is cu130 and needs driver r580.
    # Install torch separately from a cu12x index, then `-e . --no-build-isolation`.
    "torch>=2.6,<2.12",
    "tqdm>=4.66,<5",
    # sm70 fork: upstream's 5.16 floor + torchvision>=0.26 are for the Qwen3-VL path
    # (torchvision 0.26 pins torch 2.11 and would drag the resolver past the cu12x
    # torch); multimodal serving is off-contract on sm_70, so neither is carried.
    "transformers>=5.5,<6",
    "triton>=3.5,<3.8; platform_system == 'Linux'",  # sm70: floor = production pin triton==3.5.0 (3.2 has a tile-independent codegen bug; 3.6+ bundles CUDA-13 ptxas, no sm_70). Serve installs it --no-deps over the SIF default; fla kernels carry no 3.2-only APIs.
    "uvicorn>=0.30,<1",
]

[project.urls]
Homepage = "https://github.com/FlashML-org/FreeToken"
Repository = "https://github.com/FlashML-org/FreeToken"
Issues = "https://github.com/FlashML-org/FreeToken/issues"

[project.scripts]
ft = "freetoken.cli:main"

[project.optional-dependencies]
dev = ["pytest>=6.0"]
# Native fused-kernel packages. Without them the runtime falls back to the pure-Triton
# kernels in freetoken.kernel.triton (and the 'triton' attention backend). Install
# `freetoken[accel]` for the full native fast path.
fi = ["flashinfer-python[cu13]==0.6.18.post1"]
# renamed from sgl-kernel at 0.4; still imports as `sgl_kernel`, so never co-install both
sgl = ["sglang-kernel==0.4.5"]
accel = ["freetoken[fi,sgl]"]
# NOTE: the Marlin W4A16 NVFP4 expert-GEMM path (sm_80-99) borrows vLLM's AOT wheel
# (vllm>=0.14,<0.15), which pins transformers>=4.56,<5 and so is INCOMPATIBLE with the
# core transformers>=5.5 requirement. It is therefore not a lockable extra and is left
# out of the default resolution — install it separately (`pip install 'vllm>=0.14,<0.15'`)
# in a dedicated environment when you specifically need the Marlin path.

# uv-only provenance pins — pip ignores this section and resolves from PyPI. sm70 fork:
# torch resolves from the cu124 index (the only cu12x index; PyPI's plain torch wheel is
# cu130). sglang-kernel stays cu130/torch-2.11-pinned and is NOT installable under the
# lowered torch floor — the accel extras are unresolved on this branch; the pure-Triton
# path is the supported configuration. `explicit = true` scopes each index to the one
# package that needs it (the torch index also mirrors stale copies of common deps, e.g.
# packaging<=24.1, which would otherwise shadow PyPI under uv's first-index strategy).
[tool.uv.sources]
torch = { index = "pytorch-cu124" }
sglang-kernel = { index = "sglang-cu130" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.setuptools]
include-package-data = true
package-dir = {"" = "python"}

[tool.setuptools.dynamic]
version = {attr = "freetoken.version.__version__"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
"*" = ["csrc/**/*", "moe/configs/**/*.json", "engine/draft_vocab/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "slow: takes tens of seconds (big kernel sweeps, real-checkpoint reads); deselect with -m 'not slow'",
    "needs_weights: needs a real local checkpoint, gated behind an env var (see tests/README.md)",
]
